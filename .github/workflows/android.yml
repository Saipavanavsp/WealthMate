name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/wealthmate.apk

      - uses: actions/upload-artifact@v7
        with:
          name: wealthmate-apk
          path: app/build/app/outputs/flutter-apk/wealthmate.apk

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/app/outputs/flutter-apk/wealthmate.apk
