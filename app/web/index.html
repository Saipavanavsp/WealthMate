<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WealthMate: offline-first personal finance and group expense tracker built with Flutter.">
  <meta name="author" content="Sai Pavan">
  <meta name="theme-color" content="#0F766E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WealthMate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WealthMate</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F6F8F7; }
    @media (prefers-color-scheme: dark) { body { background: #0E1513; } }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 600 18px system-ui, sans-serif; color: #0F766E;
    }
  </style>
</head>
<body>
  <div id="loading">Loading WealthMate…</div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
