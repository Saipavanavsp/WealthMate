name: wealthmate
description: Personal finance and group expense tracker with offline-first sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and DI
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.3.0

  # Navigation
  go_router: ^18.1.0

  # Networking
  dio: ^5.11.1
  connectivity_plus: ^7.3.2

  # Local storage
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Platform features
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.2
  workmanager: ^0.10.10
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1

  # UI and utilities
  cupertino_icons: ^1.0.8
  fl_chart: ^1.2.0
  intl: ^0.20.3
  csv: ^8.0.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
